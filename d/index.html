  if(s&&d.status!=="void"){
    var pays=Number(s.this_paid||0)+Number(s.credit||0),late=Number(s.previous_past_due||0)+(Number(s.this_balance)>0&&s.today&&d.due_date<s.today?Number(s.this_balance):0);
    var row=function(k,v,cls){return'<tr'+(cls?' class="'+cls+'"':"")+'><td class="k">'+k+'</td><td class="v">'+v+"</td></tr>"};
    sum='<div class="asum"><table><thead><tr><th>'+t("summary")+'</th><th class="r">'+t("totals")+"</th></tr></thead><tbody>"
      +row(t("pbeg"),esc(dn(d.period_start)),"per")+row(t("pend"),esc(dn(d.period_end)),"per")
      +row(t("prev"),esc(money(s.previous)))
      +row(t("payments"),pays>0?"−"+esc(money(pays)):esc(money(0)))
      +row(t("overdue"),esc(money(late)),late>0?"late":"")
      +row(t("curr"),esc(money(s.this_total)))
      +(function(){var nts=[];if(Number(s.total_due)<=0)nts.push(t("paidup"));else if(!(late>0))nts.push(t("dueby")+" "+esc(dt(d.due_date)));if(s.by_property)nts.push(t("forprop"));
        return nts.length?'<tr class="nts"><td colspan="2">'+nts.join(" · ")+"</td></tr>":""})()
      +row(t("tad"),esc(money(s.total_due)),"tot")+"</tbody></table></div>"}
  // account activity, with blank lines so a short invoice still reads like a statement
  var many=addrs.length>1||items.some(function(it){return it.address});
  var rows=items.map(function(it){var loc=it.address||d.property_address||"";return'<tr><td class="d">'+esc(dn(it.date))+'</td><td class="l">'+esc(loc)+"</td><td class=\"tt\">"+esc(it.title||"")+"</td><td>"+esc(it.description)+(loc?'<div class="lm">'+esc(loc)+"</div>":"")+'</td><td class="a">'+esc(money(it.amount))+"</td></tr>"}).join("");
  // ruled blank lines fill the sheet, like the old statements (phones only show a few)
  for(var i=items.length;i<16;i++)rows+='<tr class="pad'+(i>=6?" more":"")+(i>=10?" scr":"")+'"><td class="d"></td><td class="l"></td><td class="tt"></td><td></td><td class="a"></td></tr>';
  h+='<div class="sect"><b>'+t("activity")+"</b><span>"+t("keep")+"</span></div>"
    +'<table class="led"><thead><tr><th>'+t("date")+'</th><th class="l">'+t("location")+'</th><th class="tt">'+t("ttl")+"</th><th>"+t("desc")+"</th><th>"+t("total")+"</th></tr></thead><tbody>"+rows
    +"</tbody></table>";
  var ct='<div class="ct">'+clientBlock(t("billto"),c,d.reference?"<div>"+t("ref")+": "+esc(d.reference)+"</div>":"")
    +'<div class="blk"><span class="lb">'+t("questions")+"</span><b>"+esc(b.name||"Latta Corp")+"</b>"+[b.phone,b.email].filter(Boolean).map(function(x){return"<div>"+esc(x)+"</div>"}).join("")+"</div>"
    +'<div class="gap"></div><img class="wmg" src="../images/logo-wordmark-green.svg" alt=""></div>';
  h+='<div class="sumwrap">'+ct+(sum||"")+"</div>"+stamp;
  h+=(b.footer?'<div class="thx">'+esc(b.footer)+"</div>":"")+"</div></div>";
  document.title=t("invoice")+" "+n+" · "+(b.name||"Latta Corp");
  return h}

function drawEstimate(){
  var d=data.doc,b=data.business,c=data.client,items=data.items||[];
  var expired=(d.status==="draft"||d.status==="sent")&&d.valid_until&&d.valid_until<today();
  var banner="";
  if(expired)banner='<div class="sm" style="color:#b3261e;font-weight:700;margin:10px 0">'+tq("expired")+"</div>";
  var canAct=!preview&&(d.status==="draft"||d.status==="sent")&&!expired,n=num(d.number,isQ()?"QTE-":"EST-");
  var h='<img class="wmk" src="../images/logo-tree-watermark.png" alt=""><div class="cl qd"><div class="top"><div class="lg"><img src="../images/logo-tree-header.png" alt="'+esc(b.name||"Latta Corp")+'"></div>'
    +'<div class="mid2"><div class="w est">'+(isQ()?t("q_word"):t("e_word"))+"</div>"+(d.title?'<div class="jt">'+esc(d.title)+"</div>":"")
    +"</div>"
    +hdrRight(b,1)+'</div><div class="inner">';
  // who it's for leads the top row (account number beside the name); notes then fit beside the summary
  var cells=[[t("prepfor"),(c.name||"")+(c.account_no?" ("+c.account_no+")":""),1],[tq("cest"),n],[tq("edate"),dn(d.issue_date)],[t("validU"),dn(d.valid_until)],[t("saddr"),d.property_address||"—",1]];
  h+=gridRow(cells);
  var rows=items.map(function(it){return'<tr><td class="tt">'+esc(it.title||"")+"</td><td>"+esc(it.description)+'</td><td class="q">'+esc(it.qty||"")+'</td><td class="a">'+esc(money(it.amount))+"</td></tr>"}).join("");
  // printed copies fill the page with ruled lines, minus the room the notes take (about 95 characters a line)
  var noteLines=d.scope?Math.max(0,String(d.scope).split("\n").reduce(function(a,l){return a+Math.max(1,Math.ceil(l.length/45))},0)-7):0;
  var padN=Math.max(3,PRINT_ROWS-noteLines-items.length);
  for(var i=0;i<padN;i++)rows+='<tr class="pad'+(i>=3?" pr":"")+'"><td class="tt"></td><td></td><td class="q"></td><td class="a"></td></tr>';
  h+='<div class="sect"><b>'+t("propwork")+"</b><span>"+t("goodthru")+"</span></div>"
    +'<table class="led"><thead><tr><th class="tt">'+t("ttl")+"</th><th>"+t("desc")+'</th><th class="q">'+t("qty")+"</th><th>"+t("total")+"</th></tr></thead><tbody>"+rows+"</tbody></table>";
  var row=function(k,v,cls){return'<tr'+(cls?' class="'+cls+'"':"")+'><td class="k">'+k+'</td><td class="v" colspan="2">'+v+"</td></tr>"};
  var sub=items.reduce(function(a,it){return a+(Number(it.amount)||0)},0),aj=adjCalc(sub,d.adjustments),orows="";
  var optRow=function(x){return'<tr class="opt"><td class="k">'+(x.kind==="other"?esc(x.label||t("aother")):t(x.kind==="discount"?"adisc":"a"+x.kind))+'</td><td class="p">'+esc(pctTxt(x.pct))+'</td><td class="v">'+(x.kind==="discount"?"−":"")+esc(money(x.amt))+"</td></tr>"};
  orows=(aj.opt?optRow(aj.opt):row("&nbsp;","&nbsp;","blank"))+optRow(aj.tax||{kind:"tax",pct:0,amt:0});
  // a required deposit shows under the total (it does not change the total)
  var dp=d.deposit&&(d.deposit.pct||d.deposit.amt)?d.deposit:null,depAmt=dp?(dp.mode==="pct"?Math.round(Number(d.total)*Number(dp.pct))/100:Number(dp.amt)):0;
  var depRows=depAmt>0?'<tr class="dep dep1"><td class="k">'+t("depreq")+'</td><td class="p">'+esc(pctTxt(dp.mode==="pct"?dp.pct:(d.total?depAmt/d.total*100:0)))+'</td><td class="v">'+esc(money(depAmt))+"</td></tr>"
    +'<tr class="dep"><td class="k">'+t("depbal")+'</td><td class="v" colspan="2">'+esc(money(Math.round((Number(d.total)-depAmt)*100)/100))+"</td></tr>"
    :'<tr class="dep dep1"><td class="k">'+t("depreq")+'</td><td class="p">0%</td><td class="v">'+esc(money(0))+"</td></tr>";
  var sum='<div class="asum est"><table><thead><tr><th>'+tq("esum")+'</th><th colspan="2">'+t("totals")+"</th></tr></thead><tbody>"
    +row(t("subtotal"),esc(money(sub)))+orows+row(tq("etotal"),esc(money(d.total)),"tot")+depRows
    +(isQ()?"":'<tr class="nts"><td colspan="3">'+t("e_note")+"</td></tr>")+"</tbody></table></div>";
  // Notes & Terms sit under Prepared For, beside the summary, instead of a band of their own
  // Notes & Terms sit beside the summary, running its full height
  // a Notes & Terms box beside the summary, the same height; with no notes it has ruled lines to write on
  var ct='<div class="ct"><div class="nbox"><div class="nbh">'+t("notes")+"</div>"+(d.scope?'<div class="ntx">'+esc(d.scope)+"</div>":'<div class="nlines"></div>')+"</div></div>";
  var notes=d.scope?'<div class="notes"><div class="nh">'+t("notes")+'</div><div class="nb">'+esc(d.scope)+"</div></div>"
    :"";
  var acc=d.status==="accepted",sigOk=acc&&/^data:image\/png;base64,/.test(d.response_signature||"");
  var cell=function(cls,v,lb){return'<div class="apc'+(cls?" "+cls:"")+'"><div class="apv">'+v+"</div><span>"+lb+"</span></div>"};
  var mark=acc?'<span class="ok">✓ '+t("accepted").toUpperCase()+(d.responded_at?" · "+esc(dts(d.responded_at)):"")+"</span>"
    :d.status==="declined"?'<span class="no">'+t("declined").toUpperCase()+(d.responded_at?" · "+esc(dts(d.responded_at)):"")+"</span>":"";
  var appr='<div class="appr"><div class="aph"><b>'+t("appr")+'</b><span class="apl2">'+(isQ()?t("q_ap"):t("e_ap"))+"</span>"+mark+'</div><div class="apg">'
    +cell("sigc",sigOk?'<img src="'+d.response_signature+'" alt="'+esc(t("sig"))+'">':'<span class="sx">X</span>',t("sig"))
    +cell("",acc?esc(d.response_name||""):"",t("pname"))
    +cell("",acc&&d.responded_at?esc(dn(String(d.responded_at).slice(0,10))):"",t("date"))
    +cell("",acc?esc(d.response_po||""):"",t("po"))
    +"</div></div>";
  h+='<div class="sumwrap">'+ct+sum+"</div>"+appr+banner;
  AFTER=(canAct?'<div class="accept sign" id="acc"><div class="ah"><b>'+t("ahead")+"</b><span>"+t("ahelp2")+(depAmt>0?" "+esc(t("depnote").replace("{d}",money(depAmt))):"")+"</span></div>"
     +'<div class="sgrid"><div><label>'+t("sig")+' <button type="button" class="clr" id="sclr">'+t("clear")+'</button></label><canvas id="spad" width="640" height="150"></canvas></div>'
     +'<div><label for="an">'+t("name")+'</label><input id="an" autocomplete="name" maxlength="120"><label for="apo">'+t("pooptional")+'</label><input id="apo" maxlength="60"><div class="row"><button class="go" id="ay" type="button">'+tq("accept")+'</button><button class="no" id="an2" type="button">'+t("decline")+'</button></div></div></div>'
     +'<div class="err" id="aerr" role="alert"></div><div class="legal">'+(isQ()?t("q_esign"):t("e_esign"))+"</div></div>":"");
  h+=(b.footer?'<div class="thx">'+esc(b.footer)+"</div>":"")+"</div></div>";
  document.title=tq("estimate")+" "+n+" · "+(b.name||"Latta Corp");
  return h}

// signature pad: draw with a finger, mouse or stylus
var sigInk=false;
function sigPad(){
  var cv=document.getElementById("spad");if(!cv)return;var cx=cv.getContext("2d"),drawing=false,last=null;sigInk=false;
  cx.lineWidth=3.2;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#12301b";
  function pt(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener("pointerdown",function(e){drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);cx.beginPath();cx.arc(last.x,last.y,1.4,0,6.3);cx.fillStyle=cx.strokeStyle;cx.fill();sigInk=true;e.preventDefault()});
  cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pt(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;e.preventDefault()});
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){cv.addEventListener(ev,function(){drawing=false})});
  document.getElementById("sclr").addEventListener("click",function(){cx.clearRect(0,0,cv.width,cv.height);sigInk=false})}
function respond(decision){
  var name=document.getElementById("an").value.trim(),note="",err=document.getElementById("aerr"),cv=document.getElementById("spad");
  if(decision==="accepted"&&!sigInk){err.textContent=t("needsig");return}
  if(decision==="accepted"&&!name){err.textContent=t("needname");return}
  if(decision==="declined"&&!confirm(tq("confirmD")))return;
  var y=document.getElementById("ay"),n=document.getElementById("an2");y.disabled=n.disabled=true;err.textContent=t("sending");
  var poEl=document.getElementById("apo");
  rpc("respond_estimate",{tok:tok(),decision:decision,who:name,note:note,po:poEl?poEl.value.trim():"",sig:decision==="accepted"&&cv?cv.toDataURL("image/png"):null}).then(function(r){
    if(r&&r.ok){load(function(){var a=document.getElementById("paper");var m=document.createElement("div");m.className="state";m.style.margin="0 auto";m.style.color="#1b552b";m.style.fontWeight="700";m.textContent=decision==="accepted"?t("thanksA"):t("thanksD");a.insertBefore(m,a.firstChild)})}
    else{y.disabled=n.disabled=false;err.textContent=t("failed")}
  },function(){y.disabled=n.disabled=false;err.textContent=t("failed")})}

function draw(){
  var bar=document.getElementById("bar");bar.hidden=embed;
  document.getElementById("en").className=lang==="en"?"on":"";document.getElementById("es").className=lang==="es"?"on":"";document.getElementById("pr").textContent=t("print");
  document.documentElement.lang=lang;
  AFTER="";root.innerHTML='<div id="paper" class="sheet">'+(data.kind==="invoice"?drawInvoice():drawEstimate())+"</div>"+AFTER;
  if(data.kind==="estimate")layoutEst();else fitRows();
  var ay=document.getElementById("ay");if(ay){ay.addEventListener("click",function(){respond("accepted")});document.getElementById("an2").addEventListener("click",function(){respond("declined")});sigPad()}
  if(preview)setTimeout(function(){parent.postMessage({type:"lc-doc-h",h:document.documentElement.scrollHeight},location.origin)},30)}

function showState(msg){root.innerHTML='<div class="state">'+esc(msg)+"</div>";document.getElementById("bar").hidden=true}
function load(cb){
  var tk=tok();if(tk.length<32){showState(t("nf"));return}
  rpc("public_doc",{tok:tk,peek:new URLSearchParams(location.search).get("p")==="1"}).then(function(r){
    if(!r||!r.kind){showState(t("nf"));return}
    data=r;draw();if(cb)cb()},function(){showState(t("err"))})}
function setLang(l){lang=l;try{localStorage.setItem("lc_doc_lang",l)}catch(e){}if(data)draw();else showState(t("load"))}
document.getElementById("en").addEventListener("click",function(){setLang("en")});
document.getElementById("es").addEventListener("click",function(){setLang("es")});
document.getElementById("pr").addEventListener("click",function(){window.print()});
document.getElementById("state").textContent=t("load");
if(preview){
  window.addEventListener("message",function(e){if(e.origin!==location.origin||!e.data||e.data.type!=="lc-doc")return;data=e.data.data;draw()});
  root.innerHTML="";parent.postMessage({type:"lc-doc-ready"},location.origin);
}else load();
})();
</script>
