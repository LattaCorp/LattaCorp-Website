  if(s&&d.status!=="void"){
    var pays=Number(s.this_paid||0)+Number(s.credit||0),late=Number(s.previous_past_due||0)+(Number(s.this_balance)>0&&s.today&&d.due_date<s.today?Number(s.this_balance):0);
    var row=function(k,v,cls){return'<tr'+(cls?' class="'+cls+'"':"")+'><td class="k">'+k+'</td><td class="v">'+v+"</td></tr>"};
    sum='<div class="asum"><table><thead><tr><th>'+t("summary")+'</th><th class="r">'+t("totals")+"</th></tr></thead><tbody>"
      +row(t("prev"),esc(money(s.previous)))
      +row(t("payments"),pays>0?"−"+esc(money(pays)):esc(money(0)))
      +row(t("overdue"),esc(money(late)),late>0?"late":"")
      +row(t("curr"),esc(money(s.this_total)))
      +row(t("tad"),esc(money(s.total_due)),"tot")+"</tbody></table>"
      +(Number(s.total_due)<=0?'<div class="nt">'+t("paidup")+"</div>":'<div class="nt">'+t("dueby")+" "+esc(dt(d.due_date))+"</div>")
      +(s.by_property?'<div class="nt">'+t("forprop")+"</div>":"")+"</div>"}
  h+='<div class="billrow">'+to+"</div>";
  // account activity, with blank lines so a short invoice still reads like a statement
  var many=addrs.length>1||items.some(function(it){return it.address});
  var rows=items.map(function(it){var loc=it.address||d.property_address||"";return'<tr><td class="d">'+esc(dn(it.date))+'</td><td class="l">'+esc(loc)+"</td><td>"+esc(it.description)+(loc?'<div class="lm">'+esc(loc)+"</div>":"")+'</td><td class="a">'+esc(money(it.amount))+"</td></tr>"}).join("");
  for(var i=items.length;i<6;i++)rows+='<tr class="pad"><td class="d"></td><td class="l"></td><td></td><td class="a"></td></tr>';
  h+='<div class="sect"><b>'+t("activity")+"</b><span>"+t("keep")+"</span></div>"
    +'<table class="led"><thead><tr><th>'+t("date")+'</th><th class="l">'+t("location")+"</th><th>"+t("desc")+"</th><th>"+t("amount")+"</th></tr></thead><tbody>"+rows
    +"</tbody></table>";
  var ct='<div class="ct"><b>'+esc(b.name||"Latta Corp")+"</b>"+[b.address,b.phone,b.email].filter(Boolean).map(function(x){return"<div>"+esc(x)+"</div>"}).join("")+'<img class="wmg" src="../images/logo-wordmark-green.svg" alt=""></div>';
  h+='<div class="sumwrap">'+ct+(sum||"")+"</div>"+stamp;
  h+=(b.footer?'<div class="thx">'+esc(b.footer)+"</div>":"")+"</div></div>";
  document.title=t("invoice")+" "+n+" · "+(b.name||"Latta Corp");
  return h}

function drawEstimate(){
  var d=data.doc,b=data.business,c=data.client,items=data.items||[];
  var expired=(d.status==="draft"||d.status==="sent")&&d.valid_until&&d.valid_until<today();
  var banner="";
  if(d.status==="accepted")banner='<div class="stamp">'+t("accepted").toUpperCase()+" "+esc(d.responded_at?dts(d.responded_at):"")+(d.response_name?" · "+esc(d.response_name):"")+"</div>";
  else if(d.status==="declined")banner='<div class="stamp bad">'+t("declined").toUpperCase()+" "+esc(d.responded_at?dts(d.responded_at):"")+"</div>";
  else if(expired)banner='<div class="sm" style="color:#b3261e;font-weight:700;margin:10px 0">'+t("expired")+"</div>";
  var canAct=(d.status==="draft"||d.status==="sent")&&!expired;
  var h=head(b,t("est"))+'<div class="body"><div class="facts"><div class="fact"><div class="k">'+t("estimate")+'</div><div class="v">'+esc(num(d.number,"EST-"))+'</div></div><div class="fact"><div class="k">'+t("issued")+'</div><div class="v">'+esc(dt(d.issue_date))+'</div></div><div class="fact"><div class="k">'+t("validuntil")+'</div><div class="v">'+esc(d.valid_until?dt(d.valid_until):"—")+'</div></div><div class="fact due"><div class="k">'+t("total")+'</div><div class="v">'+esc(money(d.total))+"</div></div></div>"
   +'<div class="bill"><div class="k">'+t("prepfor")+"</div>"+who(c)+"</div>"
   +(d.title?'<h1 class="ttl">'+esc(d.title)+"</h1>":"")+(d.scope?'<p class="scope">'+esc(d.scope)+"</p>":"")
   +'<table><thead><tr><th>'+t("desc")+'</th><th class="r">'+t("amount")+"</th></tr></thead><tbody>"+lines(items,false)+'</tbody><tfoot><tr><td class="r"><b>'+t("total")+'</b></td><td class="r"><b>'+esc(money(d.total))+"</b></td></tr></tfoot></table>"+banner
   +(canAct?'<div class="accept" id="acc"><h2>'+t("ahead")+"</h2><div class=\"sm\">"+t("ahelp")+'</div><label for="an">'+t("name")+'</label><input id="an" autocomplete="name" maxlength="120"><label for="anote">'+t("note")+'</label><textarea id="anote" rows="2" maxlength="500"></textarea><div class="row"><button class="go" id="ay" type="button">'+t("accept")+'</button><button class="no" id="an2" type="button">'+t("decline")+'</button></div><div class="err" id="aerr" role="alert"></div></div>':"")
   +'<div class="foot">'+esc(b.footer||"")+"</div></div>";
  document.title=t("estimate")+" "+num(d.number,"EST-")+" · "+(b.name||"Latta Corp");
  return h}

function respond(decision){
  var name=document.getElementById("an").value.trim(),note=document.getElementById("anote").value.trim(),err=document.getElementById("aerr");
  if(decision==="accepted"&&!name){err.textContent=t("needname");return}
  if(decision==="declined"&&!confirm(t("confirmD")))return;
  var y=document.getElementById("ay"),n=document.getElementById("an2");y.disabled=n.disabled=true;err.textContent=t("sending");
  rpc("respond_estimate",{tok:tok(),decision:decision,who:name,note:note}).then(function(r){
    if(r&&r.ok){load(function(){var a=document.getElementById("paper");var m=document.createElement("div");m.className="state";m.style.margin="0 auto";m.style.color="#1b552b";m.style.fontWeight="700";m.textContent=decision==="accepted"?t("thanksA"):t("thanksD");a.insertBefore(m,a.firstChild)})}
    else{y.disabled=n.disabled=false;err.textContent=t("failed")}
  },function(){y.disabled=n.disabled=false;err.textContent=t("failed")})}

function draw(){
  var bar=document.getElementById("bar");bar.hidden=embed;
  document.getElementById("en").className=lang==="en"?"on":"";document.getElementById("es").className=lang==="es"?"on":"";document.getElementById("pr").textContent=t("print");
  document.documentElement.lang=lang;
  root.innerHTML='<div id="paper">'+(data.kind==="invoice"?drawInvoice():drawEstimate())+"</div>";
  var ay=document.getElementById("ay");if(ay){ay.addEventListener("click",function(){respond("accepted")});document.getElementById("an2").addEventListener("click",function(){respond("declined")})}}

function showState(msg){root.innerHTML='<div class="state">'+esc(msg)+"</div>";document.getElementById("bar").hidden=true}
function load(cb){
  var tk=tok();if(tk.length<32){showState(t("nf"));return}
  rpc("public_doc",{tok:tk,peek:new URLSearchParams(location.search).get("p")==="1"}).then(function(r){
    if(!r||!r.kind){showState(t("nf"));return}
    data=r;draw();if(cb)cb()},function(){showState(t("err"))})}
function setLang(l){lang=l;try{localStorage.setItem("lc_doc_lang",l)}catch(e){}if(data)draw();else showState(t("load"))}
document.getElementById("en").addEventListener("click",function(){setLang("en")});
document.getElementById("es").addEventListener("click",function(){setLang("es")});
document.getElementById("pr").addEventListener("click",function(){window.print()});
document.getElementById("state").textContent=t("load");
load();
})();
</script>
</body>
</html>
