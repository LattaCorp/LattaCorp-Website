<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1b552b">
<title>Your document · Latta Corp</title>
<link rel="icon" href="../images/favicon-32.png">
<style>
:root{--forest:#1b552b;--leaf:#2f7d3f;--mint:#f1f8ee;--ink:#1d2a20;--muted:#5b665e;--line:#dcebd7;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:#e9efe6;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:820px;margin:14px auto 0;padding:0 14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.bar button{background:#fff;color:var(--forest);border:1px solid var(--forest);border-radius:8px;padding:8px 14px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
.bar button.on{background:var(--forest);color:#fff}
#paper{background:#fff;max-width:820px;margin:12px auto 28px;box-shadow:0 4px 24px rgba(0,0,0,.14);border-radius:8px;overflow:hidden}
.ihead{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--forest);color:#fff;padding:24px 36px}
.ibrand{display:flex;gap:14px;align-items:center}.ibrand .lg{background:#fff;border-radius:12px;padding:6px 8px;display:flex}.ibrand img{height:62px;width:auto}
.bn{font-size:1.3rem;font-weight:800;color:#fff;font-family:"Playfair Display",Georgia,serif}.ibrand .sm{font-size:.85rem;color:#d9ecd8;margin-top:2px}
.it{font-size:2rem;font-weight:800;letter-spacing:.14em;color:#fff;text-align:right}
.body{padding:26px 36px 30px}
.sm{font-size:.85rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.fact{background:var(--mint);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.fact .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.fact .v{font-weight:800;font-size:1.02rem;margin-top:2px}
.fact.due{background:var(--forest);border-color:var(--forest);color:#fff}.fact.due .k{color:#cfe6cc}
.bill{margin:0 0 18px;padding-left:12px;border-left:4px solid var(--leaf)}.bill .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.bill b{font-size:1.1rem}
h1.ttl{font-family:"Playfair Display",Georgia,serif;font-size:1.35rem;margin:0 0 6px;color:var(--forest)}
.scope{white-space:pre-wrap;margin:0 0 14px;color:var(--ink)}
table{width:100%;border-collapse:collapse;margin:8px 0}
th{background:var(--forest);color:#fff;text-align:left;padding:9px 10px;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}th.r,td.r{text-align:right}
td{padding:10px;border-bottom:1px solid #e6ece4;vertical-align:top}tbody tr:nth-child(even) td{background:#f8fbf6}td.d{width:96px;white-space:nowrap}
tfoot td{border-bottom:0;padding-top:14px;font-size:1.1rem}tfoot td.r b:last-child{color:var(--forest);font-size:1.3rem}
.stamp{display:inline-block;border:3px solid var(--leaf);color:var(--leaf);font-weight:800;padding:4px 14px;border-radius:8px;transform:rotate(-4deg);margin:8px 0}.stamp.bad{border-color:var(--red);color:var(--red)}
.pay{margin:20px 0 0;padding:14px 16px;background:var(--mint);border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:8px}.pay b{color:var(--forest)}
.accept{margin:20px 0 0;padding:16px;border:2px solid var(--forest);border-radius:10px;background:#fff}
.accept h2{margin:0 0 6px;font-size:1.1rem;color:var(--forest)}
.accept label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.accept input,.accept textarea{width:100%;font:inherit;padding:10px;border:1px solid #bcc9b9;border-radius:8px}
.accept .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.go{background:var(--forest);color:#fff;border:0;border-radius:8px;padding:12px 20px;font:700 1rem system-ui,sans-serif;cursor:pointer}.go:disabled{opacity:.6}
.no{background:none;border:0;color:var(--red);font:600 .9rem system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
.err{color:var(--red);font-size:.9rem;margin-top:8px;min-height:1.2em}
.foot{text-align:center;color:var(--leaf);margin-top:24px;font-size:1rem;font-weight:700;font-family:"Playfair Display",Georgia,serif}
.state{max-width:560px;margin:60px auto;padding:0 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){#paper{margin:8px 0 0;border-radius:0;box-shadow:none}.ihead{padding:18px 16px}.body{padding:18px 16px 24px}.facts{grid-template-columns:1fr 1fr}.it{font-size:1.5rem;text-align:left}.bar{margin-top:8px}}
@media print{body{background:#fff}.bar,.accept,noscript{display:none!important}#paper{box-shadow:none;margin:0;max-width:none;border-radius:0}@page{margin:14mm}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button type="button" id="en">English</button><button type="button" id="es">Español</button><button type="button" id="pr"></button>
</div>
<div id="root"><div class="state" id="state">Loading…</div></div>
<noscript><div class="state">Please turn on JavaScript to view this page.</div></noscript>
<script src="../crm/config.js"></script>
<script>
(function(){
"use strict";
var T={
 en:{load:"Loading…",nf:"We couldn't find this page. The link may be incomplete. Please contact us and we'll send a new one.",err:"Something went wrong loading this page. Please try again in a moment.",
  print:"Print / Save PDF",inv:"INVOICE",est:"ESTIMATE",invoice:"Invoice",estimate:"Estimate",issued:"Issued",due:"Due",amtdue:"Amount due",total:"Total",validuntil:"Valid until",billto:"Bill to",prepfor:"Prepared for",
  ref:"Ref",addr:"Service address",addrs:"Service addresses",date:"Date",service:"Service",desc:"Description",amount:"Amount",paid:"PAID",void:"VOID",pay:"How to pay",
  ahead:"Ready to go ahead?",ahelp:"Type your name to accept this estimate. We'll be in touch to schedule the work.",name:"Your full name",note:"Note for us (optional)",accept:"Accept estimate",decline:"No thanks",
  needname:"Please type your name to accept.",sending:"Sending…",failed:"Sorry, that didn't go through. Please try again, or contact us.",
  accepted:"Accepted",declined:"Declined",expired:"This estimate has expired. Please contact us for an updated one.",
  thanksA:"Thank you! Your acceptance was received. We'll be in touch soon.",thanksD:"Thanks for letting us know. Your response was received.",by:"by",on:"on",
  confirmD:"Decline this estimate?"},
 es:{load:"Cargando…",nf:"No pudimos encontrar esta página. Puede que el enlace esté incompleto. Contáctenos y le enviaremos uno nuevo.",err:"Algo salió mal al cargar esta página. Inténtelo de nuevo en un momento.",
  print:"Imprimir / Guardar PDF",inv:"FACTURA",est:"PRESUPUESTO",invoice:"Factura",estimate:"Presupuesto",issued:"Emitida",due:"Vence",amtdue:"Monto a pagar",total:"Total",validuntil:"Válido hasta",billto:"Facturar a",prepfor:"Preparado para",
  ref:"Ref",addr:"Dirección del servicio",addrs:"Direcciones del servicio",date:"Fecha",service:"Servicio",desc:"Descripción",amount:"Monto",paid:"PAGADA",void:"ANULADA",pay:"Cómo pagar",
  ahead:"¿Listo para continuar?",ahelp:"Escriba su nombre para aceptar este presupuesto. Nos comunicaremos con usted para programar el trabajo.",name:"Su nombre completo",note:"Nota para nosotros (opcional)",accept:"Aceptar presupuesto",decline:"No, gracias",
  needname:"Escriba su nombre para aceptar.",sending:"Enviando…",failed:"Lo sentimos, no se pudo enviar. Inténtelo de nuevo o contáctenos.",
  accepted:"Aceptado",declined:"Rechazado",expired:"Este presupuesto venció. Contáctenos para uno actualizado.",
  thanksA:"¡Gracias! Recibimos su aceptación. Nos comunicaremos pronto.",thanksD:"Gracias por avisarnos. Recibimos su respuesta.",by:"por",on:"el",
  confirmD:"¿Rechazar este presupuesto?"}
};
var lang="en";try{var sv=localStorage.getItem("lc_doc_lang");if(sv==="en"||sv==="es")lang=sv;else if(/^es/i.test(navigator.language||""))lang="es"}catch(e){if(/^es/i.test(navigator.language||""))lang="es"}
var data=null,root=document.getElementById("root"),cfg=window.CRM_CONFIG;
function t(k){return T[lang][k]||T.en[k]||k}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return"$"+(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\.00$/,"")}
function pd(s){var m=String(s||"").slice(0,10).split("-");return new Date(+m[0],+m[1]-1,+m[2])}
function dt(s){if(!s)return"";return pd(s).toLocaleDateString(lang==="es"?"es-US":"en-US",{month:"short",day:"numeric",year:"numeric"})}
function dts(s){if(!s)return"";var d=new Date(s);return d.toLocaleDateString(lang==="es"?"es-US":"en-US",{month:"short",day:"numeric",year:"numeric"})}
function num(n,p){var s=String(n||0);while(s.length<4)s="0"+s;return p+s}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function tok(){var q=new URLSearchParams(location.search).get("t");return(q||"").replace(/[^a-zA-Z0-9]/g,"")}
function rpc(name,args){
  return fetch(cfg.url+"/rest/v1/rpc/"+name,{method:"POST",headers:{"apikey":cfg.key,"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json"},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})}
function head(b,title){
  return'<div class="ihead"><div class="ibrand"><div class="lg"><img src="../images/logo-tree-header.png" alt=""></div><div><div class="bn">'+esc(b.name||"Latta Corp")+'</div><div class="sm">'+[b.address,b.phone,b.email].filter(Boolean).map(esc).join("<br>")+'</div></div></div><div class="it">'+esc(title)+"</div></div>"}
function lines(items,withDate){
  return items.map(function(it){return"<tr>"+(withDate?'<td class="d">'+esc(it.date?dt(it.date):"")+"</td>":"")+"<td>"+esc(it.description)+(it.address?'<div class="sm">'+esc(it.address)+"</div>":"")+'</td><td class="r">'+esc(money(it.amount))+"</td></tr>"}).join("")}
function who(c){return"<b>"+esc(c.name||"")+"</b>"+(c.company?"<div>"+esc(c.company)+"</div>":"")}

function drawInvoice(){
  var d=data.doc,b=data.business,c=data.client,items=data.items||[],addrs=[];
  items.forEach(function(it){if(it.address&&addrs.indexOf(it.address)<0)addrs.push(it.address)});
  var stamp=d.status==="paid"?'<div class="stamp">'+t("paid")+" "+esc(d.paid_at?dts(d.paid_at):"")+(d.paid_method?" · "+esc(d.paid_method):"")+"</div>":d.status==="void"?'<div class="stamp bad">'+t("void")+"</div>":"";
  var open=d.status==="open";
  var h=head(b,t("inv"))+'<div class="body"><div class="facts"><div class="fact"><div class="k">'+t("invoice")+'</div><div class="v">'+esc(num(d.number,"LC-"))+'</div></div><div class="fact"><div class="k">'+t("issued")+'</div><div class="v">'+esc(dt(d.issue_date))+'</div></div><div class="fact"><div class="k">'+t("due")+'</div><div class="v">'+esc(dt(d.due_date))+'</div></div><div class="fact due"><div class="k">'+(open?t("amtdue"):t("total"))+'</div><div class="v">'+esc(money(d.total))+"</div></div></div>"
   +'<div class="bill"><div class="k">'+t("billto")+"</div>"+who(c)+(d.reference?'<div class="sm">'+t("ref")+": "+esc(d.reference)+"</div>":"")+(addrs.length?'<div class="sm">'+(addrs.length>1?t("addrs"):t("addr"))+": "+addrs.map(esc).join("; ")+"</div>":"")+"</div>"
   +'<table><thead><tr><th>'+t("date")+"</th><th>"+t("service")+'</th><th class="r">'+t("amount")+"</th></tr></thead><tbody>"+lines(items,true)+'</tbody><tfoot><tr><td></td><td class="r"><b>'+t("total")+'</b></td><td class="r"><b>'+esc(money(d.total))+"</b></td></tr></tfoot></table>"+stamp
   +(open?'<div class="pay"><b>'+t("pay")+"</b><div>"+(b.zelle?"Zelle: "+esc(b.zelle)+"<br>":"")+esc(b.payment_note||"")+"</div></div>":"")
   +'<div class="foot">'+esc(b.footer||"")+"</div></div>";
  document.title=t("invoice")+" "+num(d.number,"LC-")+" · "+(b.name||"Latta Corp");
  return h}

function drawEstimate(){
  var d=data.doc,b=data.business,c=data.client,items=data.items||[];
  var expired=(d.status==="draft"||d.status==="sent")&&d.valid_until&&d.valid_until<today();
  var banner="";
  if(d.status==="accepted")banner='<div class="stamp">'+t("accepted").toUpperCase()+" "+esc(d.responded_at?dts(d.responded_at):"")+(d.response_name?" · "+esc(d.response_name):"")+"</div>";
  else if(d.status==="declined")banner='<div class="stamp bad">'+t("declined").toUpperCase()+" "+esc(d.responded_at?dts(d.responded_at):"")+"</div>";
  else if(expired)banner='<div class="sm" style="color:#b3261e;font-weight:700;margin:10px 0">'+t("expired")+"</div>";
  var canAct=(d.status==="draft"||d.status==="sent")&&!expired;
  var h=head(b,t("est"))+'<div class="body"><div class="facts"><div class="fact"><div class="k">'+t("estimate")+'</div><div class="v">'+esc(num(d.number,"EST-"))+'</div></div><div class="fact"><div class="k">'+t("issued")+'</div><div class="v">'+esc(dt(d.issue_date))+'</div></div><div class="fact"><div class="k">'+t("validuntil")+'</div><div class="v">'+esc(d.valid_until?dt(d.valid_until):"—")+'</div></div><div class="fact due"><div class="k">'+t("total")+'</div><div class="v">'+esc(money(d.total))+"</div></div></div>"
   +'<div class="bill"><div class="k">'+t("prepfor")+"</div>"+who(c)+"</div>"
   +(d.title?'<h1 class="ttl">'+esc(d.title)+"</h1>":"")+(d.scope?'<p class="scope">'+esc(d.scope)+"</p>":"")
   +'<table><thead><tr><th>'+t("desc")+'</th><th class="r">'+t("amount")+"</th></tr></thead><tbody>"+lines(items,false)+'</tbody><tfoot><tr><td class="r"><b>'+t("total")+'</b></td><td class="r"><b>'+esc(money(d.total))+"</b></td></tr></tfoot></table>"+banner
   +(canAct?'<div class="accept" id="acc"><h2>'+t("ahead")+"</h2><div class=\"sm\">"+t("ahelp")+'</div><label for="an">'+t("name")+'</label><input id="an" autocomplete="name" maxlength="120"><label for="anote">'+t("note")+'</label><textarea id="anote" rows="2" maxlength="500"></textarea><div class="row"><button class="go" id="ay" type="button">'+t("accept")+'</button><button class="no" id="an2" type="button">'+t("decline")+'</button></div><div class="err" id="aerr" role="alert"></div></div>':"")
   +'<div class="foot">'+esc(b.footer||"")+"</div></div>";
  document.title=t("estimate")+" "+num(d.number,"EST-")+" · "+(b.name||"Latta Corp");
  return h}

function respond(decision){
  var name=document.getElementById("an").value.trim(),note=document.getElementById("anote").value.trim(),err=document.getElementById("aerr");
  if(decision==="accepted"&&!name){err.textContent=t("needname");return}
  if(decision==="declined"&&!confirm(t("confirmD")))return;
  var y=document.getElementById("ay"),n=document.getElementById("an2");y.disabled=n.disabled=true;err.textContent=t("sending");
  rpc("respond_estimate",{tok:tok(),decision:decision,who:name,note:note}).then(function(r){
    if(r&&r.ok){load(function(){var a=document.getElementById("paper");var m=document.createElement("div");m.className="state";m.style.margin="0 auto";m.style.color="#1b552b";m.style.fontWeight="700";m.textContent=decision==="accepted"?t("thanksA"):t("thanksD");a.insertBefore(m,a.firstChild)})}
    else{y.disabled=n.disabled=false;err.textContent=t("failed")}
  },function(){y.disabled=n.disabled=false;err.textContent=t("failed")})}

function draw(){
  var bar=document.getElementById("bar");bar.hidden=false;
  document.getElementById("en").className=lang==="en"?"on":"";document.getElementById("es").className=lang==="es"?"on":"";document.getElementById("pr").textContent=t("print");
  document.documentElement.lang=lang;
  root.innerHTML='<div id="paper">'+(data.kind==="invoice"?drawInvoice():drawEstimate())+"</div>";
  var ay=document.getElementById("ay");if(ay){ay.addEventListener("click",function(){respond("accepted")});document.getElementById("an2").addEventListener("click",function(){respond("declined")})}}

function showState(msg){root.innerHTML='<div class="state">'+esc(msg)+"</div>";document.getElementById("bar").hidden=true}
function load(cb){
  var tk=tok();if(tk.length<32){showState(t("nf"));return}
  rpc("public_doc",{tok:tk,peek:new URLSearchParams(location.search).get("p")==="1"}).then(function(r){
    if(!r||!r.kind){showState(t("nf"));return}
    data=r;draw();if(cb)cb()},function(){showState(t("err"))})}
function setLang(l){lang=l;try{localStorage.setItem("lc_doc_lang",l)}catch(e){}if(data)draw();else showState(t("load"))}
document.getElementById("en").addEventListener("click",function(){setLang("en")});
document.getElementById("es").addEventListener("click",function(){setLang("es")});
document.getElementById("pr").addEventListener("click",function(){window.print()});
document.getElementById("state").textContent=t("load");
load();
})();
</script>
</body>
</html>
